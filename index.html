<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Seatline Cinemas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky marquee header over a single content column; the seat picker takes over the whole viewport. */
:root {
  --bg: #0e0f15;
  --surface: #161822;
  --surface-2: #1e212e;
  --line: #2b2f40;
  --fg: #efe9dd;
  --muted: #9c9eae;
  --accent: #f2b33d;
  --accent-ink: #251a05;
  --seat: #5d7db3;
  --booked: #34384a;
  --danger: #ec6a5e;
  --ok: #5fc796;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; letter-spacing: 0.01em; line-height: 1.05; margin: 0; text-wrap: balance; text-transform: uppercase; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.logo-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.logo-mark svg { width: 18px; height: 18px; }
.logo-word { font-family: var(--f-display); font-weight: 900; font-size: 24px; letter-spacing: 0.06em; text-transform: uppercase; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 7px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 14px; }
.nav button:hover { color: var(--fg); background: var(--surface); }
.nav button[aria-current="page"] { color: var(--accent-ink); background: var(--accent); }
.mode-pill { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }

main { max-width: 1200px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: #3c4157; background: #252939; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: #ffc35a; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn svg { width: 16px; height: 16px; flex: none; }

/* Home */
.feature { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 44px; }
.feature-screen { position: relative; aspect-ratio: 2.2 / 1; border-radius: 6px; overflow: hidden; background: #000; box-shadow: 0 30px 80px -30px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 0 10px #050508; max-width: 100%; }
.feature-screen canvas, .feature-screen img, .feature-screen video { width: 100%; height: 100%; object-fit: cover; display: block; }
.feature h1 { font-size: clamp(40px, 6vw, 72px); margin: 8px 0 12px; }
.feature .meta { margin-bottom: 14px; }
.feature p.syn { color: #cfcabf; max-width: 46ch; margin-bottom: 20px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.meta .cert { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--fg); font-family: var(--f-mono); font-size: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.section-head h2 { font-size: 30px; }
.posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 22px 18px; }
.poster-card { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.poster { aspect-ratio: 2 / 3; width: 100%; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--surface); position: relative; box-shadow: 0 14px 30px -18px #000; transition: transform .2s, box-shadow .2s; }
.poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.poster-card:hover .poster { transform: translateY(-3px); box-shadow: 0 20px 40px -18px #000, 0 0 0 2px var(--accent); }
.poster-card .t { font-weight: 700; font-size: 16px; line-height: 1.25; }
.poster-card .s { font-size: 13px; color: var(--muted); }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 40px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }

/* Movie page */
.back-link { background: none; border: 0; color: var(--muted); padding: 0; display: inline-flex; gap: 6px; align-items: center; margin-bottom: 18px; font-weight: 600; }
.back-link:hover { color: var(--fg); }
.movie-head { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; margin-bottom: 32px; }
.movie-head h1 { font-size: clamp(36px, 5vw, 60px); margin: 6px 0 10px; }
.movie-head p.syn { max-width: 60ch; color: #cfcabf; margin-top: 14px; }
.dates { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 22px; scrollbar-width: thin; }
.date { flex: none; width: 64px; padding: 8px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; justify-items: center; line-height: 1.15; }
.date .dw { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.date .dd { font-family: var(--f-display); font-weight: 800; font-size: 26px; }
.date .dm { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.date[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.date[aria-pressed="true"] .dw, .date[aria-pressed="true"] .dm { color: var(--accent-ink); }
.venues { display: grid; gap: 12px; }
.venue { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 20px; align-items: center; }
.venue h3 { font-family: var(--f-body); text-transform: none; font-size: 16px; font-weight: 700; letter-spacing: 0; }
.venue .addr { font-size: 13px; color: var(--muted); }
.venue .tiers { font-size: 12px; color: var(--muted); margin-top: 4px; }
.times { display: flex; flex-wrap: wrap; gap: 8px; grid-column: 1 / -1; }
.time { border: 1px solid color-mix(in srgb, var(--ok) 45%, var(--line)); color: var(--ok); background: transparent; border-radius: 8px; padding: 7px 14px; font-family: var(--f-mono); font-size: 14px; font-weight: 500; }
.time:hover { background: color-mix(in srgb, var(--ok) 14%, transparent); }
.time:disabled { color: var(--muted); border-color: var(--line); opacity: .5; cursor: not-allowed; text-decoration: line-through; }

/* Dialog */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(4, 5, 8, .72); display: grid; place-items: center; padding: 16px; backdrop-filter: blur(4px); }
.dialog { width: min(460px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 16px; max-height: calc(100% - 32px); overflow: auto; }
.dialog h2 { font-size: 30px; }
.count-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.count-grid button { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-family: var(--f-display); font-weight: 800; font-size: 24px; }
.count-grid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tier-list { display: grid; gap: 6px; font-size: 14px; }
.tier-list div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }

/* Seat stage */
.stage { position: fixed; inset: 0; z-index: 40; background: #06070b; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.stage-3d { position: relative; overflow: hidden; min-width: 0; }
.hall-canvas { display: block; touch-action: none; outline: none; }
.tag-layer { position: absolute; inset: 0; pointer-events: none; }
.seat-tag { position: absolute; left: 0; top: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--f-mono); font-weight: 600; font-size: 11px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
.seat-tag::after { content: ""; position: absolute; left: 50%; bottom: -4px; margin-left: -4px; border: 4px solid transparent; border-bottom: 0; border-top-color: var(--accent); }
.stage-bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(#06070bee, #06070b00); pointer-events: none; }
.stage-bar > * { pointer-events: auto; }
.stage-bar .title { min-width: 0; }
.stage-bar .title b { font-family: var(--f-display); font-size: 22px; text-transform: uppercase; letter-spacing: .02em; display: block; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage-bar .title span { font-size: 12px; color: var(--muted); }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: rgba(22, 24, 34, .85); flex: none; }
.icon-btn:hover { border-color: #444a63; }
.icon-btn svg { width: 18px; height: 18px; }
.cam-dock { max-width: calc(100% - 90px); position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.seg { display: flex; background: rgba(22, 24, 34, .9); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 10px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px #3a3f55; }
.seg button svg { width: 15px; height: 15px; }
.hint { font-size: 12px; color: var(--muted); background: rgba(6, 7, 11, .6); padding: 4px 8px; border-radius: 6px; }
.hint kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--fg); }
.zoom-dock { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; }
.fly-pad { display: grid; grid-template-columns: repeat(3, 38px); gap: 4px; }
.fly-pad button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: rgba(22,24,34,.9); display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
.fly-pad svg { width: 16px; height: 16px; }
.seatview-chip { position: absolute; top: calc(72px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: rgba(22,24,34,.92); border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); border-radius: 999px; padding: 6px 6px 6px 14px; display: flex; gap: 10px; align-items: center; font-size: 13px; white-space: nowrap; }
.tooltip { position: absolute; pointer-events: none; background: rgba(14, 15, 21, .95); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; line-height: 1.35; transform: translate(14px, 14px); white-space: nowrap; z-index: 2; }
.tooltip b { font-family: var(--f-mono); font-size: 13px; }

.panel { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); }
.panel-scroll { overflow: auto; padding: 18px; display: grid; gap: 18px; align-content: start; flex: 1; min-height: 0; }
.panel-foot { border-top: 1px solid var(--line); padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 12px; border-radius: 3px 3px 2px 2px; display: inline-block; }
.sw.av { background: var(--seat); } .sw.se { background: var(--accent); } .sw.bo { background: var(--booked); box-shadow: inset 0 0 0 1px #4a4f66; }
.progress { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.progress b { font-family: var(--f-display); font-size: 34px; line-height: 1; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; }
.pip { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
.pip.on { background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); padding: 3px 4px 3px 9px; font-family: var(--f-mono); font-size: 13px; }
.chip button { border: 0; background: none; width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: var(--muted); }
.chip button:hover { color: var(--fg); background: #2b2f40; }
.chip svg { width: 14px; height: 14px; }
.minimap { background: #0b0c12; border: 1px solid var(--line); border-radius: 10px; padding: 12px 10px 10px; overflow-x: auto; }
.mm-screen { height: 5px; border-radius: 0 0 50% 50% / 0 0 100% 100%; background: linear-gradient(90deg, transparent, #cdd7ff, transparent); margin: 0 10% 12px; opacity: .8; }
.mm-row { display: flex; align-items: center; gap: 3px; margin-bottom: 3px; }
.mm-row .lbl { width: 14px; font-family: var(--f-mono); font-size: 9px; color: var(--muted); text-align: center; flex: none; }
.mm-cells { display: grid; gap: 2px; flex: 1; }
.mm-seat { aspect-ratio: 1; min-width: 6px; border: 0; padding: 0; border-radius: 2px 2px 1px 1px; background: var(--seat); }
.mm-seat.booked { background: var(--booked); cursor: not-allowed; }
.mm-seat.selected { background: var(--accent); }
.mm-seat:hover:not(.booked) { outline: 1px solid #fff; }
.mm-gap { aspect-ratio: 1; }
.tier-rows { display: grid; gap: 4px; font-size: 13px; }
.tier-rows div { display: flex; justify-content: space-between; gap: 8px; }
.sum-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.sum-total { display: flex; justify-content: space-between; align-items: baseline; }
.sum-total b { font-family: var(--f-display); font-size: 28px; }

/* Checkout + ticket */
.checkout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.card h2 { font-size: 24px; margin-bottom: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: #d6d1c6; }
.field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0; }
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; }
.field .help { font-size: 12px; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.pay-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pay-opt { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--bg); display: flex; gap: 10px; align-items: center; text-align: left; }
.pay-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pay-opt svg { width: 22px; height: 22px; flex: none; color: var(--accent); }
.pay-opt b { display: block; font-size: 14px; }
.pay-opt span { font-size: 12px; color: var(--muted); }
.notice { border-radius: 10px; padding: 10px 12px; font-size: 13px; background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); color: #f1dcb2; }
.notice.err { background: color-mix(in srgb, var(--danger) 10%, transparent); border-color: color-mix(in srgb, var(--danger) 35%, transparent); color: #f6c2bc; }

.ticket { display: grid; grid-template-columns: minmax(0, 1fr) 150px; background: var(--fg); color: #191814; border-radius: 14px; overflow: hidden; position: relative; max-width: 720px; }
.ticket-main { padding: 22px 24px; display: grid; gap: 12px; min-width: 0; }
.ticket-main h2 { font-size: 36px; }
.ticket-main .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 16px; }
.kv .k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #6b6556; font-weight: 700; }
.kv .v { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.ticket-stub { border-left: 2px dashed #b8b09d; padding: 22px 16px; display: grid; gap: 10px; justify-items: center; align-content: center; background: #e5ddcc; position: relative; }
.ticket-stub::before, .ticket-stub::after { content: ""; position: absolute; left: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
.ticket-stub::before { top: -11px; } .ticket-stub::after { bottom: -11px; }
.code-grid { width: 96px; height: 96px; display: grid; grid-template-columns: repeat(11, 1fr); gap: 1px; }
.code-grid i { background: #191814; }
.code-grid i.o { background: transparent; }
.ticket-stub .mono { font-size: 12px; font-weight: 600; letter-spacing: .06em; }
.tickets-list { display: grid; gap: 14px; }
.booking-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.booking-row .poster { border-radius: 6px; }
.status { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.status.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.status.x { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }

/* Admin */
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.admin-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.admin-card h3 { font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-size: 16px; font-weight: 700; }
.admin-card .row { display: flex; gap: 8px; flex-wrap: wrap; }
.mini-poster { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; }
.stat-row { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 18px; }
.stat-row div { display: grid; }

<script>
/* Hall: builds a 3D auditorium from a theatre layout and handles navigation + seat picking. */
const SEAT_RGB = {
  available: 0x5d7db3, availableHover: 0xa9c3f0,
  selected: 0xf2b33d, selectedHover: 0xffd98a,
  booked: 0x262933, bookedHover: 0x30333e
};

function computeSeats(theatre) {
  const tiers = {};
  (theatre.tiers || []).forEach(t => { tiers[t.id] = t; });
  const rows = (theatre.layout && theatre.layout.rows) || [];
  const seats = [];
  let cols = 0;
  rows.forEach(r => { cols = Math.max(cols, (r.cells || '').length); });
  rows.forEach((r, ri) => {
    let n = 0;
    const cells = r.cells || '';
    for (let c = 0; c < cells.length; c++) {
      if (cells[c] !== 'S') continue;
      n++;
      const tier = tiers[r.tier] || (theatre.tiers || [])[0] || { id: 'std', name: 'Standard', price: 150, style: 'standard' };
      seats.push({ id: r.label + n, row: r.label, num: n, rowIdx: ri, col: c, tierId: tier.id, tier: tier, price: Number(tier.price) || 0 });
    }
  });
  return { seats: seats, cols: cols, rows: rows, tiers: tiers };
}

function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

class Hall {
  constructor(el, opts) {
    this.el = el;
    this.opts = opts || {};
    this.mode = 'orbit';
    this.states = {};
    this.hoverId = null;
    this.focusId = null;
    this.keys = {};
    this.anim = null;
    this.mediaTick = null;
    this.disposed = false;

    const r = this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    r.domElement.className = 'hall-canvas';
    r.domElement.tabIndex = 0;
    r.domElement.setAttribute('aria-label', '3D auditorium. Drag to look around, scroll to zoom, click a seat to select it.');
    el.appendChild(r.domElement);

    this.tagLayer = document.createElement('div');
    this.tagLayer.className = 'tag-layer';
    el.appendChild(this.tagLayer);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x06070b);
    this.camera = new THREE.PerspectiveCamera(42, 1, 0.05, 500);
    this.controls = new THREE.OrbitControls(this.camera, r.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.08;
    this.controls.maxPolarAngle = Math.PI * 0.495;
    this.controls.screenSpacePanning = true;

    this.root = new THREE.Group();
    this.scene.add(this.root);
    this.raycaster = new THREE.Raycaster();
    this.ptr = new THREE.Vector2();
    this.clock = new THREE.Clock();

    this._onResize = () => this.resize();
    this.ro = new ResizeObserver(this._onResize);
    this.ro.observe(el);
    this.resize();
    this.bindInput();
    r.setAnimationLoop(() => this.frame());
  }

  resize() {
    const w = Math.max(1, this.el.clientWidth), h = Math.max(1, this.el.clientHeight);
    this.renderer.setSize(w, h, false);
    this.renderer.domElement.style.width = w + 'px';
    this.renderer.domElement.style.height = h + 'px';
    this.camera.aspect = w / h;
    this.camera.fov = w < 520 ? 55 : 42;
    this.camera.updateProjectionMatrix();
  }

  clearRoot() {
    const disposeObj = o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.map && m.map !== this.screenTex) m.map.dispose(); m.dispose(); });
    };
    this.root.traverse(disposeObj);
    this.root.clear();
  }

  build(theatre) {
    this.clearRoot();
    const info = computeSeats(theatre);
    this.info = info;
    const P = 0.64, side = 1.6;
    const cols = Math.max(info.cols, 6);
    const W = cols * P + side * 2;
    const frontGap = Math.max(4.2, W * 0.42);
    const rowGeo = [];
    let z = frontGap, y = 0.12;
    info.rows.forEach((row, i) => {
      const tier = info.tiers[row.tier];
      const rec = tier && tier.style === 'recliner';
      const depth = rec ? 1.5 : 1.0;
      if (i > 0) y += rec ? 0.42 : 0.3;
      rowGeo.push({ z0: z, depth: depth, y: y, rec: rec, label: row.label });
      z += depth;
    });
    const zEnd = z, yLast = y;
    const D = zEnd + 2.4;
    const screenW = Math.min(W - 1.4, Math.max(7, W * 0.86));
    const screenH = screenW / 2.2;
    const screenBottom = 1.05;
    const H = Math.max(screenBottom + screenH + 1.4, yLast + 3.4);
    Object.assign(this, { W: W, D: D, H: H, P: P, screenW: screenW, screenH: screenH, screenBottom: screenBottom, rowGeo: rowGeo, cols: cols });
    const xOf = c => (c - (cols - 1) / 2) * P;

    // Room shell: back faces only, so the camera sees in from outside (cutaway) and all walls from inside.
    const wall = new THREE.MeshStandardMaterial({ color: 0x15161f, roughness: 0.95, side: THREE.BackSide });
    const ceil = new THREE.MeshStandardMaterial({ color: 0x0c0d13, roughness: 1, side: THREE.BackSide });
    const floor = new THREE.MeshStandardMaterial({ color: 0x1b1a22, roughness: 1, side: THREE.BackSide });
    const front = new THREE.MeshStandardMaterial({ color: 0x0b0b10, roughness: 1, side: THREE.BackSide });
    const room = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), [wall, wall, ceil, floor, wall, front]);
    room.position.set(0, H / 2, D / 2);
    this.root.add(room);

    // Acoustic panels and sconces on the side walls: single-sided planes facing into the room,
    // so they disappear with the wall when the camera looks in from outside.
    const panelMat = new THREE.MeshStandardMaterial({ color: 0x20222f, roughness: 0.9 });
    const sconceMat = new THREE.MeshBasicMaterial({ color: 0xffb862 });
    const panelGeo = new THREE.PlaneGeometry(1.1, H * 0.55);
    const sconceGeo = new THREE.PlaneGeometry(0.12, 0.42);
    for (let pz = 2; pz < D - 1; pz += 1.6) {
      [-1, 1].forEach(s => {
        const p = new THREE.Mesh(panelGeo, panelMat);
        p.position.set(s * (W / 2 - 0.02), H * 0.5, pz);
        p.rotation.y = -s * Math.PI / 2;
        this.root.add(p);
      });
    }
    for (let sz = 3; sz < D - 1; sz += 3.2) {
      [-1, 1].forEach(s => {
        const m = new THREE.Mesh(sconceGeo, sconceMat);
        m.position.set(s * (W / 2 - 0.04), H * 0.82, sz);
        m.rotation.y = -s * Math.PI / 2;
        this.root.add(m);
      });
    }

    // Stage under the screen
    const stage = new THREE.Mesh(new THREE.BoxGeometry(W, 0.45, 1.3), new THREE.MeshStandardMaterial({ color: 0x101119, roughness: 0.9 }));
    stage.position.set(0, 0.225, 0.65);
    this.root.add(stage);

    // Risers and aisle step lights
    const riserMat = new THREE.MeshStandardMaterial({ color: 0x1d1c25, roughness: 0.95 });
    const stepMat = new THREE.MeshBasicMaterial({ color: 0xff9f3d });
    const stepGeo = new THREE.BoxGeometry(side * 0.7, 0.025, 0.04);
    rowGeo.forEach((g, i) => {
      const box = new THREE.Mesh(new THREE.BoxGeometry(W, g.y, g.depth), riserMat);
      box.position.set(0, g.y / 2, g.z0 + g.depth / 2);
      this.root.add(box);
      [-1, 1].forEach(s => {
        const st = new THREE.Mesh(stepGeo, stepMat);
        st.position.set(s * (W / 2 - side / 2), g.y + 0.013, g.z0 + 0.03);
        this.root.add(st);
      });
    });
    const walk = new THREE.Mesh(new THREE.BoxGeometry(W, yLast + 0.001, D - zEnd), riserMat);
    walk.position.set(0, (yLast + 0.001) / 2, zEnd + (D - zEnd) / 2);
    this.root.add(walk);

    // Screen: gently curved, with black masking
    const sg = new THREE.PlaneGeometry(screenW, screenH, 48, 1);
    const pos = sg.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i) / (screenW / 2);
      pos.setZ(i, x * x * screenW * 0.035);
    }
    pos.needsUpdate = true;
    this.screenMat = new THREE.MeshBasicMaterial({ color: 0xffffff, map: this.screenTex || null });
    const screen = new THREE.Mesh(sg, this.screenMat);
    this.screenY = screenBottom + screenH / 2;
    this.screenZ = 0.4;
    screen.position.set(0, this.screenY, this.screenZ);
    this.root.add(screen);
    const mask = new THREE.Mesh(new THREE.PlaneGeometry(screenW + 0.9, screenH + 0.7), new THREE.MeshBasicMaterial({ color: 0x030304 }));
    mask.position.set(0, this.screenY, 0.3);
    this.root.add(mask);

    // Lighting
    this.root.add(new THREE.AmbientLight(0x8a92b8, 0.5));
    this.root.add(new THREE.HemisphereLight(0x9aa6ff, 0x1a120a, 0.35));
    const dl = new THREE.DirectionalLight(0xffffff, 0.35);
    dl.position.set(-W, H * 3, D);
    this.root.add(dl);
    this.screenLight = new THREE.PointLight(0xbfd0ff, 1.4, D * 1.6, 1.4);
    this.screenLight.position.set(0, this.screenY, 3.2);
    this.root.add(this.screenLight);
    [-1, 1].forEach(s => {
      const wl = new THREE.PointLight(0xffa860, 0.5, W * 1.2, 2);
      wl.position.set(s * (W / 2 - 0.6), H * 0.75, D * 0.55);
      this.root.add(wl);
    });

    // Projector beam from the booth window
    const apex = new THREE.Vector3(0, H - 0.7, D - 0.05);
    const sx = screenW / 2, sy0 = screenBottom, sy1 = screenBottom + screenH, sz = this.screenZ + 0.1;
    const c = [new THREE.Vector3(-sx, sy0, sz), new THREE.Vector3(sx, sy0, sz), new THREE.Vector3(sx, sy1, sz), new THREE.Vector3(-sx, sy1, sz)];
    const bv = [];
    for (let i = 0; i < 4; i++) { const a = c[i], b = c[(i + 1) % 4]; bv.push(apex.x, apex.y, apex.z, a.x, a.y, a.z, b.x, b.y, b.z); }
    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.Float32BufferAttribute(bv, 3));
    const beam = new THREE.Mesh(bg, new THREE.MeshBasicMaterial({ color: 0xc9d6ff, transparent: true, opacity: 0.028, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
    this.root.add(beam);
    const booth = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.4), new THREE.MeshBasicMaterial({ color: 0xe8eeff }));
    booth.position.copy(apex).add(new THREE.Vector3(0, 0, -0.02));
    booth.rotation.y = Math.PI;
    this.root.add(booth);
    this.screenCorners = c;

    // Seats (instanced)
    const n = info.seats.length;
    const cushG = new THREE.ExtrudeGeometry(roundedRect(0.5, 0.46, 0.08), { depth: 0.1, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.025, bevelSegments: 2, curveSegments: 4 });
    cushG.rotateX(-Math.PI / 2); cushG.center();
    const backG = new THREE.ExtrudeGeometry(roundedRect(0.5, 0.6, 0.1), { depth: 0.09, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.025, bevelSegments: 2, curveSegments: 4 });
    backG.center();
    const armG = new THREE.BoxGeometry(0.07, 0.5, 0.52);
    const seatMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.62, metalness: 0.04 });
    const armMat = new THREE.MeshStandardMaterial({ color: 0x0f1016, roughness: 0.7 });

    ctx.globalAlpha = 0.85;
    ctx.fillText(('Now showing  ·  ' + (m.language || '') + '  ·  ' + (m.cert || '')).toUpperCase(), w / 2, h * 0.24);
    ctx.globalAlpha = 1;

    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 20;

    ctx.font = '900 ' + Math.round(w * 0.2) + 'px "Big Shoulders Display", Impact, sans-serif';
    words.forEach(wd => { const tst = cur ? cur + ' ' + wd : wd; if (ctx.measureText(tst).width > w - pad * 2 && cur) { lines.push(cur); cur = wd; } else cur = tst; });

    lines.slice().reverse().forEach((l, i) => ctx.fillText(l, pad, base - i * fs * 0.92));

const posterCache = {};
function posterSrc(m) {
  if (m.poster) { const u = S.store.mediaUrl(m.poster); if (u) return u; }
  const key = [m.id, m.title, m.language, m.genre, m.cert, m.runtime, JSON.stringify(artOf(m))].join('|');
  if (!posterCache[key]) {
    const cv = document.createElement('canvas'); cv.width = 400; cv.height = 600;
    drawArt(cv.getContext('2d'), 400, 600, m, 1.3, 'poster');
    posterCache[key] = cv.toDataURL('image/jpeg', 0.86);

  if (m.poster) { const u = S.store.mediaUrl(m.poster); if (u) return { kind: 'image', url: u }; }
  return { kind: 'canvas', draw: (ctx, w, h, t) => drawArt(ctx, w, h, m, t, 'screen') };
}

/* ================= data stores ================= */
const DEMO_KEY = 'seatline-demo-v1';
class DemoStore {
  constructor() {
    this.mode = 'demo'; this.subs = new Set(); this.objectUrls = {};
    let d = null;
    try { d = JSON.parse(localStorage.getItem(DEMO_KEY) || 'null'); } catch (e) { d = null; }
    if (!d || !d.theatres) {
      const s = buildSeed(); d = { theatres: {}, movies: {}, seatmaps: {}, bookings: {}, media: {} };
      s.theatres.forEach(t => { d.theatres[t.id] = t; }); s.movies.forEach(m => { d.movies[m.id] = m; });
    }
    this.d = d; this.uid = 'demo-user';
  }
  save() {
    try { localStorage.setItem(DEMO_KEY, JSON.stringify(this.d)); }
    catch (e) { const m = this.d.media; this.d.media = {}; try { localStorage.setItem(DEMO_KEY, JSON.stringify(this.d)); } catch (e2) {} this.d.media = m; }
  }
  emit() { this.save(); this.subs.forEach(f => f()); }
  on(f) { this.subs.add(f); f(); return () => this.subs.delete(f); }
  watchCatalog(cb) { return this.on(() => cb(Object.values(this.d.theatres), Object.values(this.d.movies))); }
  demoTaken(showId, theatre) {
    const out = {}; if (!theatre) return out;
    const rate = 0.12 + (hashStr(showId) % 1000) / 1000 * 0.38;
    computeSeats(theatre).seats.forEach(s => { if ((hashStr(showId + s.id) % 1000) / 1000 < rate) out[s.id] = 'demo'; });
    return out;
  }
  watchSeatmap(showId, cb) {
    const th = this.d.theatres[showId.split('~')[1]];
    return this.on(() => cb(Object.assign(this.demoTaken(showId, th), (this.d.seatmaps[showId] || {}).taken || {})));
  }
  watchMyBookings(cb) { return this.on(() => cb(Object.values(this.d.bookings))); }
  watchAllBookings(cb) { return this.on(() => cb(Object.values(this.d.bookings))); }
  async put(coll, obj) { this.d[coll][obj.id] = clone(obj); this.emit(); }
  async remove(coll, id) { delete this.d[coll][id]; this.emit(); }
  async upload(file) {
    const id = Math.random().toString(36).slice(2, 10);
    if (file.type.startsWith('image/') && file.size < 1.5e6) {
      const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
      this.d.media[id] = url; this.save(); return 'm:' + id;
    }
    this.objectUrls[id] = URL.createObjectURL(file);
    return 'o:' + id;
  }
  mediaUrl(ref) {
    if (!ref) return null;
    const k = ref.slice(2);
    if (ref.startsWith('m:')) return this.d.media[k] || null;
    if (ref.startsWith('o:')) return this.objectUrls[k] || null;
    return null;
  }
  async book(o) {
    await sleep(700);
    const th = this.d.theatres[o.theatreId];
    const taken = Object.assign(this.demoTaken(o.showId, th), (this.d.seatmaps[o.showId] || {}).taken || {});
    const clash = o.seats.filter(s => taken[s]);
    if (clash.length) return { ok: false, clash: clash, msg: clash.join(', ') + ' just got booked by someone else.' };
    const id = bookingCode();
    const sm = this.d.seatmaps[o.showId] || (this.d.seatmaps[o.showId] = { showId: o.showId, taken: {} });
    o.seats.forEach(s => { sm.taken[s] = id; });
    const b = Object.assign({}, o.record, { id: id, ownerId: this.uid });
    this.d.bookings[id] = b; this.emit();
    return { ok: true, booking: b };
  }
  async cancel(b) {
    const sm = this.d.seatmaps[b.showId];
    if (sm) Object.keys(sm.taken).forEach(k => { if (sm.taken[k] === b.id) delete sm.taken[k]; });
    if (this.d.bookings[b.id]) { this.d.bookings[b.id].status = 'cancelled'; this.d.bookings[b.id].cancelledAt = new Date().toISOString(); }
    this.emit();
  }
}

class LiveStore {
  constructor(db, assets, uid) { this.mode = 'live'; this.db = db; this.assets = assets; this.uid = uid; }
  watchCatalog(cb, onErr) {
    let th = null, mv = null;
    const fire = () => { if (th && mv) cb(th, mv); };
    const a = this.db.collection('theatres').onSnapshot(s => { th = s.docs.map(d => Object.assign({}, d.data(), { id: d.id })); fire(); }, onErr);
    const b = this.db.collection('movies').onSnapshot(s => { mv = s.docs.map(d => Object.assign({}, d.data(), { id: d.id })); fire(); }, onErr);
    return () => { a(); b(); };
  }
  watchSeatmap(showId, cb) {
    return this.db.doc('seatmaps/' + showId).onSnapshot(s => cb(s.exists ? Object.assign({}, (s.data().taken || {})) : {}), () => toast('Live seat updates paused. Reopen the show to refresh.'));
  }
  itemsOf(d, owner) { const items = (d.exists && d.data().items) || {}; return Object.keys(items).map(k => Object.assign({}, items[k], { id: k, ownerId: owner })); }
  watchMyBookings(cb) {
    if (!this.uid) { cb([]); return () => {}; }
    return this.db.doc('bookings/' + this.uid).onSnapshot(s => cb(this.itemsOf(s, this.uid)), () => cb([]));
  }
  watchAllBookings(cb) {
    return this.db.collection('bookings').onSnapshot(s => cb([].concat.apply([], s.docs.map(d => this.itemsOf(d, d.id)))), () => cb([]));
  }
  async put(coll, obj) { const o = clone(obj); const id = o.id; delete o.id; await this.db.doc(coll + '/' + id).set(o); }
  async remove(coll, id) { await this.db.doc(coll + '/' + id).delete(); }
  async upload(file) {
    if (!this.assets) throw { code: 'not_granted' };
    const r = await this.assets.upload(file);
    return 'a:' + r.id;
  }
  mediaUrl(ref) { return ref && ref.startsWith('a:') ? '/_blob/' + ref.slice(2) : null; }
  async book(o) {
    if (!this.uid) return { ok: false, msg: 'Sign in to Claude to book tickets.' };
    const ref = this.db.doc('seatmaps/' + o.showId);
    try {
      let lease = null;
      for (let i = 0; i < 4; i++) {
        lease = await ref.acquire({ holder: this.uid, ttlMs: 4000 });
        if (lease.acquired) break;
        await sleep(900);
      }
      if (!lease || !lease.acquired) return { ok: false, msg: 'Another booking for this show is being confirmed. Try again in a few seconds.' };
      const snap = await ref.get();
      const taken = snap.exists ? (snap.data().taken || {}) : {};
      const clash = o.seats.filter(s => taken[s]);
      if (clash.length) return { ok: false, clash: clash, msg: clash.join(', ') + ' just got booked by someone else.' };
      const id = bookingCode();
      const add = {}; o.seats.forEach(s => { add[s] = id; });
      if (snap.exists) await ref.update({ taken: add }); else await ref.set({ showId: o.showId, taken: add });
      const rec = clone(o.record);
      const bref = this.db.doc('bookings/' + this.uid);
      try {
        const bs = await bref.get();
        if (bs.exists) await bref.update({ items: { [id]: rec } }); else await bref.set({ items: { [id]: rec } });
      } catch (e) {
        const back = Object.assign({}, taken); await ref.set({ showId: o.showId, taken: back }).catch(() => {});
        throw e;
      }
      return { ok: true, booking: Object.assign({}, rec, { id: id, ownerId: this.uid }) };
    } catch (e) {
      if (e && e.code === 'invalid_argument') return { ok: false, msg: 'Your access to this page is view-only, so the booking could not be saved. Ask the owner for Contributor access.' };
      if (e && e.code === 'quota_exceeded') return { ok: false, msg: 'The booking store is full. Ask the owner to clear old bookings.' };
      return { ok: false, msg: 'The booking could not be saved (' + ((e && e.code) || 'error') + '). Try again.' };
    }
  }
  async cancel(b) {
    const ref = this.db.doc('seatmaps/' + b.showId);
    const snap = await ref.get();
    if (snap.exists) {
      const taken = Object.assign({}, snap.data().taken || {});
      Object.keys(taken).forEach(k => { if (taken[k] === b.id) delete taken[k]; });
      await ref.set({ showId: b.showId, taken: taken });
    }
    await this.db.doc('bookings/' + b.ownerId).update({ items: { [b.id]: { status: 'cancelled', cancelledAt: new Date().toISOString() } } });
  }
}

function datesFor(m) {
  const today = isoDate(new Date());
  const sc = m.schedule || {};
  const out = [];
  for (let i = 0; i < 14 && out.length < 7; i++) {
    const d = addDays(today, i);
    if ((!sc.start || d >= sc.start) && (!sc.end || d <= sc.end)) out.push(d);
  }
  return out;
}
function timePassed(date, time) {
  const now = new Date();
  if (date !== isoDate(now)) return false;
  const p = time.split(':').map(Number);
  return p[0] * 60 + p[1] <= now.getHours() * 60 + now.getMinutes() + 10;
}

function mountFeature(el, m) {

  if (md.kind === 'image') { el.innerHTML = '<img alt="" src="' + esc(md.url) + '">'; return; }
  const cv = document.createElement('canvas'); cv.width = 1100; cv.height = 500; el.appendChild(cv);

function toggleSeat(id) {
  const st = S.stage; if (!st) return;
  if (st.taken[id]) { toast(id + ' is already booked.'); return; }
  const i = st.selected.indexOf(id);
  if (i >= 0) st.selected.splice(i, 1);
  else {
    if (st.selected.length >= st.count) { const dropped = st.selected.shift(); if (st.count > 1) toast('Swapped ' + dropped + ' for ' + id + '. You asked for ' + st.count + ' seats.'); }
    st.selected.push(id);
  }
  if (st.hall) st.hall.setFocus(st.selected[st.selected.length - 1] || null);
  refreshStage();
}
function pickBest() {
  const st = S.stage, n = st.count, info = st.info;
  const nRows = info.rows.length;
  const ideal = nRows * 0.62, mid = (info.cols - 1) / 2;
  let best = null;
  info.rows.forEach((r, ri) => {
    const rowSeats = info.seats.filter(s => s.rowIdx === ri);
    for (let k = 0; k + n <= rowSeats.length; k++) {
      const run = rowSeats.slice(k, k + n);
      let ok = run.every(s => !st.taken[s.id]);
      for (let j = 1; ok && j < run.length; j++) if (run[j].col - run[j - 1].col !== 1) ok = false;
      if (!ok) continue;
      const cx = (run[0].col + run[run.length - 1].col) / 2;
      const score = Math.abs(cx - mid) * 0.8 + Math.abs(ri - ideal) * 1.4;
      if (!best || score < best.score) best = { score: score, ids: run.map(s => s.id) };
    }
  });
  if (!best) {
    const free = info.seats.filter(s => !st.taken[s.id]).sort((a, b) => (Math.abs(a.col - mid) * 0.8 + Math.abs(a.rowIdx - ideal) * 1.4) - (Math.abs(b.col - mid) * 0.8 + Math.abs(b.rowIdx - ideal) * 1.4));
    if (free.length < n) { toast('Only ' + free.length + ' seats are left for this show.'); return; }
    best = { ids: free.slice(0, n).map(s => s.id) };
    toast('No ' + n + ' seats together, so these are the best single seats.');
  }
  st.selected = best.ids;
  if (st.hall) { st.hall.setFocus(best.ids[Math.floor(best.ids.length / 2)]); if (st.hall.mode !== 'orbit') st.hall.preset('overview'); }
  refreshStage();
}
function showTip(s, e) {

  const r = $('#hall3d').getBoundingClientRect();
  tip.innerHTML = '<b>' + esc(s.id) + '</b> · Row ' + esc(s.row) + ', seat ' + s.num + '<br><span class="muted">' + esc(s.tier.name) + ' · ' + inr(s.price) + ' · ' + state + '</span>';
  tip.style.left = Math.min(e.clientX - r.left, r.width - 200) + 'px';
  tip.style.top = Math.min(e.clientY - r.top, r.height - 70) + 'px';

}
function onCamMode(mode, seat) {

function onStageClick(e) {
  const st = S.stage; if (!st) return;
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.seat) { toggleSeat(b.dataset.seat); return; }
  if (b.dataset.rm) { toggleSeat(b.dataset.rm); return; }
  if (b.dataset.view) { if (st.hall) st.hall.viewFromSeat(b.dataset.view); return; }
  if (b.dataset.cam) {
    if (!st.hall) return;
    if (b.dataset.cam === 'fly') st.hall.fly();
    else { st.lastPreset = b.dataset.cam; st.hall.preset(b.dataset.cam); }
    return;
  }
  const a = b.dataset.st;
  if (a === 'close') { closeStage(); return; }
  if (a === 'zin' && st.hall) st.hall.zoom(1);
  if (a === 'zout' && st.hall) st.hall.zoom(-1);
  if (a === 'sound' && st.hall) { st.sound = !st.sound; st.hall.setSound(st.sound); b.innerHTML = st.sound ? ICON.sound : ICON.mute; b.setAttribute('aria-label', st.sound ? 'Mute trailer' : 'Turn trailer sound on'); }
  if (a === 'best') pickBest();
  if (a === 'count') { const show = st.show; openCount(show, st.count); }
  if (a === 'proceed') {
    const byId = {}; st.info.seats.forEach(s => { byId[s.id] = s; });
    const seats = st.selected.map(id => byId[id]);
    S.order = { show: st.show, count: st.count, seats: seats, price: priceOf(seats) };
    closeStage(); S.sub = 'checkout'; render(); window.scrollTo(0, 0);
  }
}

async function submitPay() {
  const name = $('#cName').value.trim(), phone = $('#cPhone').value.replace(/\D/g, ''), email = $('#cEmail').value.trim();
  const err = $('#payErr');
  const problems = [];
  if (!name) problems.push('Enter the name the tickets should be under.');
  if (!/^[6-9]\d{9}$/.test(phone.slice(-10)) || phone.length < 10) problems.push('Enter a 10-digit mobile number.');
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) problems.push('Check the email address, or leave it empty.');
  if (problems.length) { err.innerHTML = '<div class="notice err">' + problems.map(esc).join('<br>') + '</div>'; return; }
  err.innerHTML = '';
  prefs('contact', { name: name, phone: phone.slice(-10), email: email });
  const btn = $('#payBtn'); btn.disabled = true; btn.textContent = 'Confirming your seats…';
  const o = S.order, m = movieById(o.show.movieId), t = theatreById(o.show.theatreId);

  };
  const res = await S.store.book({ showId: o.show.id, theatreId: t.id, seats: record.seats, record: record });

}

    'Rules: list rows starting from the row NEAREST the screen. In each cells string, "S" is a seat and "_" is empty floor or an aisle, left to right as the audience faces the screen. ' +
    'Every cells string must be exactly cols characters long, and aisles should line up across rows. At most 40 rows and 50 cols. If you cannot see a seating plan, reply {"cols":0,"rows":[]}.';

    }
    S.canUpload = !!assets;
    S.store = new LiveStore(db, assets, uid);
  } else {
    S.store = new DemoStore();
    S.isAdmin = true; S.canUpload = true;
  }
  const slowTimer = setTimeout(() => { if (!S.loaded) { S.slow = true; render(); } }, 10000);
  S.store.watchCatalog((ths, mvs) => {
    clearTimeout(slowTimer);
    S.theatres = ths; S.movies = mvs;
    const first = !S.loaded; S.loaded = true;
    if (first || (!S.editing && !S.stage && S.sub !== 'checkout')) render();
    else renderNav();
  }, () => { S.slow = true; if (!S.loaded) render(); });
  S.store.watchMyBookings(list => { S.my = list; if (S.loaded && S.route === 'tickets' && !S.sub) render(); });
  if (S.isAdmin) S.store.watchAllBookings(list => { S.all = list; if (S.loaded && S.route === 'admin' && !S.editing) render(); });
  render();
}
boot();

</script>

</body>
</html>
